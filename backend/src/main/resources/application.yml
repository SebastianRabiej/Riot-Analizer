server:
  port: ${PORT:8080}
  servlet:
    session:
      # Admin session lifetime (idle timeout). Sessions live in server memory,
      # so a backend restart also logs the admin out.
      timeout: ${ADMIN_SESSION_TIMEOUT:8h}
      cookie:
        name: RA_SESSION
        http-only: true
        same-site: strict
        # Set APP_COOKIE_SECURE=false only for plain-http local runs.
        secure: ${APP_COOKIE_SECURE:true}
      tracking-modes: cookie

spring:
  application:
    name: riot-analizer-backend
  autoconfigure:
    # Admin auth is handled by security/AuthController against a BCrypt hash;
    # don't let Boot create a default in-memory user with a random password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/riotanalizer}
    username: ${SPRING_DATASOURCE_USERNAME:riotanalizer}
    password: ${SPRING_DATASOURCE_PASSWORD:riotanalizer}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # Existing databases were created by the old ddl-auto=update behaviour and
    # already contain the V1 tables, so adopt them as the baseline instead of
    # trying to re-run V1. Fresh/empty databases run every migration from V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Adopt existing Hibernate-generated schema"
  task:
    scheduling:
      pool:
        # ScheduledFetcher + PuuidRekeyWorker run independently.
        size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # INFO shows fetch start/progress/summary per player. Set LOG_LEVEL=DEBUG to
    # also log every Riot API call and rate-limit wait.
    com.riotanalizer: ${LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  # Single admin account — the only user who can see and manage tracking.
  # Only a BCrypt hash is stored (generate with `make admin-hash`). Leaving
  # ADMIN_PASSWORD_HASH empty disables admin login.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    max-failed-logins: ${ADMIN_MAX_FAILED_LOGINS:10}
    lockout-minutes: ${ADMIN_LOCKOUT_MINUTES:15}
    cookie-secure: ${APP_COOKIE_SECURE:true}

riot:
  api-key: ${RIOT_API_KEY:}
  platform-host: ${RIOT_PLATFORM_HOST:https://eun1.api.riotgames.com}
  regional-host: ${RIOT_REGIONAL_HOST:https://europe.api.riotgames.com}
  current-season-start-epoch-ms: ${RIOT_CURRENT_SEASON_START_EPOCH_MS:1767225600000}
  # Scheduler wake-up; each player is only fetched when its own next_check_at
  # (derived from how recently they played) is due. See ScheduledFetcher.
  scheduler-tick-ms: ${RIOT_SCHEDULER_TICK_MS:15000}
  # Early checks: while the long rate-limit window has spare room, players are
  # checked before their regular next_check_at, soonest-scheduled first, at
  # most once per min-gap each. Tracked players need min-free-ratio of the long
  # window unused (0.4 = 40 of 100 on a dev key), discovered players more.
  early-check-enabled: ${RIOT_EARLY_CHECK_ENABLED:true}
  early-check-tracked-min-gap-ms: ${RIOT_EARLY_CHECK_TRACKED_MIN_GAP_MS:120000}
  early-check-discovered-min-gap-ms: ${RIOT_EARLY_CHECK_DISCOVERED_MIN_GAP_MS:1800000}
  early-check-tracked-min-free-ratio: ${RIOT_EARLY_CHECK_TRACKED_MIN_FREE_RATIO:0.4}
  early-check-discovered-min-free-ratio: ${RIOT_EARLY_CHECK_DISCOVERED_MIN_FREE_RATIO:0.6}
  initial-player: ${RIOT_INITIAL_PLAYER:}
  match-page-size: ${RIOT_MATCH_PAGE_SIZE:100}
  fetch-batch-size: ${RIOT_FETCH_BATCH_SIZE:25}
  max-history-matches: ${RIOT_MAX_HISTORY_MATCHES:2000}
  # Background re-key of stored match participants after the API key moved to
  # another Riot application (see PlayerRekeyService / PuuidRekeyWorker).
  puuid-rekey-batch-size: ${RIOT_PUUID_REKEY_BATCH_SIZE:20}
  puuid-rekey-interval-ms: ${RIOT_PUUID_REKEY_INTERVAL_MS:5000}
  # Players met in tracked players' matches become DISCOVERED and get their
  # season history fetched with spare budget only. max-depth: 1 = only people
  # met in tracked players' games, N = N hops, -1 = unbounded, 0 = off.
  discovery-max-depth: ${RIOT_DISCOVERY_MAX_DEPTH:1}
  discovery-max-players: ${RIOT_DISCOVERY_MAX_PLAYERS:0}
  # Riot API limits (dev/personal key defaults) and the long-window permits
  # background work leaves free for user-facing requests.
  rate-limit-short-requests: ${RIOT_RATE_LIMIT_SHORT_REQUESTS:20}
  rate-limit-short-window-ms: ${RIOT_RATE_LIMIT_SHORT_WINDOW_MS:1000}
  rate-limit-long-requests: ${RIOT_RATE_LIMIT_LONG_REQUESTS:100}
  rate-limit-long-window-ms: ${RIOT_RATE_LIMIT_LONG_WINDOW_MS:120000}
  rate-limit-tracked-reserve: ${RIOT_RATE_LIMIT_TRACKED_RESERVE:10}
  rate-limit-discovered-reserve: ${RIOT_RATE_LIMIT_DISCOVERED_RESERVE:25}
